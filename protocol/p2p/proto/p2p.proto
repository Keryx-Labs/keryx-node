syntax = "proto3";
package protowire;

option go_package = "github.com/kaspanet/kaspad/protowire";

message RequestAddressesMessage{
  bool includeAllSubnetworks = 1;
  SubnetworkId subnetworkId = 2;
}

message AddressesMessage{
  repeated NetAddress addressList = 1;
}

message NetAddress{
  int64 timestamp = 1;
  bytes ip = 3;
  uint32 port = 4;
}

message SubnetworkId{
  bytes bytes = 1;
}

message TransactionMessage{
  uint32 version = 1;
  repeated TransactionInput inputs = 2;
  repeated TransactionOutput outputs = 3;
  uint64 lockTime = 4;
  SubnetworkId subnetworkId = 5;
  uint64 gas = 6;
  bytes payload = 8;
  uint64 mass = 9;
}

message TransactionInput{
  Outpoint previousOutpoint = 1;
  bytes signatureScript = 2;
  uint64 sequence = 3;
  uint32 sigOpCount = 4;
}

message Outpoint{
  TransactionId transactionId = 1;
  uint32 index = 2;
}

message TransactionId{
  bytes bytes = 1;
}
message ScriptPublicKey {
  bytes script = 1;
  uint32 version = 2;
}

message TransactionOutput{
  uint64 value = 1;
  ScriptPublicKey scriptPublicKey = 2;
}

message BlockMessage{
  BlockHeader header = 1;
  repeated TransactionMessage transactions = 2;
  // Proof-of-Model possession witness (borsh-encoded PomProof). Post-PoW, body-level,
  // absent before pom_activation. See POM_CONSENSUS_SPEC.md.
  optional bytes pom_proof = 3;
  // Proven PoM tier, carried separately so it survives IBD even when the full proof is
  // unavailable (legacy blocks have a stored tier but no proof). Consensus-critical: scales
  // the coinbase tier-reward split. Absent before pom_activation.
  optional uint32 pom_tier = 4;
  // Same v4 proof as pom_proof, in the compact multiproof encoding (pom_v4_wire): the K tile
  // Merkle paths share their upper levels, so ~40% of the sibling hashes in pom_proof are
  // redundant. Sent INSTEAD of pom_proof to peers at protocol version >= 11; exactly one of the
  // two is ever set. Decoding rebuilds a byte-identical PomProof, so what gets verified, stored
  // and re-served to older peers is unchanged.
  optional bytes pom_proof_deduped = 5;
}

message BlockBodyMessage{
  repeated TransactionMessage transactions = 1;
  // Proven PoM tier (see BlockMessage.pom_tier) — needed so a syncing node can validate the
  // coinbase tier-reward split for body-only IBD of post-pom blocks.
  optional uint32 pom_tier = 2;
  // Borsh-encoded PomProof, carried so IBD'd blocks get their possession proof persisted and
  // can later be relayed to proof-enforcing peers (otherwise they are served "naked" and
  // rejected with "PoM possession proof missing"). Absent before pom_activation.
  optional bytes pom_proof = 3;
  // Compact multiproof encoding of the same v4 proof — see BlockMessage.pom_proof_deduped.
  // Sent instead of pom_proof to peers at protocol version >= 11.
  optional bytes pom_proof_deduped = 4;
}

message BlockHeader{
  uint32 version = 1;
  repeated BlockLevelParents parents = 12;
  Hash hashMerkleRoot = 3;
  Hash acceptedIdMerkleRoot = 4;
  Hash utxoCommitment = 5;
  int64 timestamp = 6;
  uint32 bits = 7;
  uint64 nonce = 8;
  uint64 daaScore = 9;
  bytes blueWork = 10;
  Hash pruningPoint = 14;
  uint64 blueScore = 13;
  // H3 (pom_level_activation): final state of the winning PoM possession walk, committed
  // into the block hash — the header-only PoW value / block level derive from it.
  // 0 (proto default, absent on the wire) for pre-fork blocks.
  uint64 pomFinalState = 15;
  // H6: sealed service-state commitment at this header's pruning point, committed into
  // the block hash. Absent (zero) for pre-gate blocks.
  Hash serviceStateHash = 16;
  // H6: the winning walk's proven PoM tier, committed into the block hash. Zero pre-gate.
  uint32 pomTier = 17;
}

message BlockLevelParents {
  repeated Hash parentHashes = 1;
  uint32 cumulativeLevel = 2;
}

message Hash{
  bytes bytes = 1;
}

message RequestBlockLocatorMessage{
  Hash highHash = 1;
  uint32 limit = 2;
}

message BlockLocatorMessage{
  repeated Hash hashes = 1;
}

message RequestHeadersMessage{
  Hash lowHash = 1;
  Hash highHash = 2;
}

message RequestNextHeadersMessage{
}

message DoneHeadersMessage{
}

message RequestRelayBlocksMessage{
  repeated Hash hashes = 1;
}

message RequestTransactionsMessage {
  repeated TransactionId ids = 1;
}

message TransactionNotFoundMessage{
  TransactionId id = 1;
}

message InvRelayBlockMessage{
  Hash hash = 1;
}

message InvTransactionsMessage{
  repeated TransactionId ids = 1;
}

message PingMessage{
  uint64 nonce = 1;
}

message PongMessage{
  uint64 nonce = 1;
}

message VerackMessage{
}

message VersionMessage{
  uint32 protocolVersion = 1;
  uint64 services = 2;
  int64 timestamp = 3;
  NetAddress address = 4;
  bytes id = 5;
  string userAgent = 6;
  bool disableRelayTx = 8;
  SubnetworkId subnetworkId = 9;
  string network = 10;
}

message RejectMessage{
  string reason = 1;
}

message RequestPruningPointUTXOSetMessage{
  Hash pruningPointHash = 1;
}

message PruningPointUtxoSetChunkMessage{
  repeated OutpointAndUtxoEntryPair outpointAndUtxoEntryPairs = 1;
}

message OutpointAndUtxoEntryPair{
  Outpoint outpoint = 1;
  UtxoEntry utxoEntry = 2;
}

message UtxoEntry {
  uint64 amount = 1;
  ScriptPublicKey scriptPublicKey = 2;
  uint64 blockDaaScore = 3;
  bool isCoinbase = 4;
  // Coin-age (holder-reward v3) anchor. Presence-tracked: absent (old peer) falls back to
  // blockDaaScore — the pre-H4 invariant; present is taken verbatim (a genuine 0 stays 0).
  optional uint64 effectiveDaaScore = 5;
}

message RequestNextPruningPointUtxoSetChunkMessage {
}

message DonePruningPointUtxoSetChunksMessage {
}

message RequestIBDBlocksMessage{
  repeated Hash hashes = 1;
  // Lowest daa_score for which the REQUESTER still wants possession proofs; blocks below it are
  // served with pom_tier only. The requester states its own horizon because the server cannot
  // safely infer it: depth-stripping against the SERVER's virtual is unsound during IBD, since the
  // receiver's virtual lags and a block that is deep for the server may still be recent for the
  // receiver, leaving it with a band of proof-less blocks that wedges its own serving. Applied at
  // the source it is just the receiver's own policy, so nothing is stripped that the receiver would
  // have kept. Absent => send proofs for everything, i.e. the pre-v11 behaviour.
  optional uint64 pom_proof_min_daa = 2;
}

message RequestBlockBodiesMessage{
  repeated Hash hashes = 1;
  // Lowest daa_score for which the REQUESTER still wants possession proofs — see
  // RequestIBDBlocksMessage.pom_proof_min_daa.
  optional uint64 pom_proof_min_daa = 2;
}

message UnexpectedPruningPointMessage{
}

message IbdBlockLocatorMessage {
  Hash targetHash = 1;
  repeated Hash blockLocatorHashes = 2;
}

message RequestIBDChainBlockLocatorMessage{
  Hash lowHash = 1;
  Hash highHash = 2;
}

message IbdChainBlockLocatorMessage {
  repeated Hash blockLocatorHashes = 1;
}

// Legacy name of this message is `RequestAnticoneMessage`
message RequestAntipastMessage{
  Hash blockHash = 1;
  Hash contextHash = 2;
}

message IbdBlockLocatorHighestHashMessage {
  Hash highestHash = 1;
}

message IbdBlockLocatorHighestHashNotFoundMessage {
}

message BlockHeadersMessage {
  repeated BlockHeader blockHeaders = 1;
}

message RequestPruningPointAndItsAnticoneMessage {
}

message RequestNextPruningPointAndItsAnticoneBlocksMessage{
}

// TODO: remove once v4 is obsolete
message BlockWithTrustedDataMessage {
  BlockMessage block = 1;
  uint64 daaScore = 2;
  repeated DaaBlock daaWindow = 3;
  repeated BlockGhostdagDataHashPair ghostdagData = 4;
}

// TODO: rename to `TrustedBlock` once v5 is obsolete
message DaaBlock {
  BlockMessage block = 3;
  GhostdagData ghostdagData = 2;
}

// TODO: rename to `TrustedHeader` once v5 is obsolete
message DaaBlockV4 {
  BlockHeader header = 1;
  GhostdagData ghostdagData = 2;
}

// TODO: remove once v5 is obsolete
message BlockGhostdagDataHashPair {
  Hash hash = 1;
  GhostdagData ghostdagData = 2;
}

message GhostdagData {
  uint64 blueScore = 1;
  bytes blueWork = 2;
  Hash selectedParent = 3;
  repeated Hash mergeSetBlues = 4;
  repeated Hash mergeSetReds = 5;
  repeated BluesAnticoneSizes bluesAnticoneSizes = 6;
}

message BluesAnticoneSizes {
  Hash blueHash = 1;
  uint32 anticoneSize = 2;
}

message DoneBlocksWithTrustedDataMessage {
}

message PruningPointsMessage {
  repeated BlockHeader headers = 1;
}

message RequestPruningPointProofMessage {
}

message PruningPointProofMessage {
  repeated PruningPointProofHeaderArray headers = 1;
}

message PruningPointProofHeaderArray {
  repeated BlockHeader headers = 1;
}

message ReadyMessage {
}

message BlockWithTrustedDataV4Message {
  BlockMessage block = 1;
  repeated uint64 daaWindowIndices = 2; // TODO: remove once v5 is obsolete
  repeated uint64 ghostdagDataIndices = 3; // TODO: remove once v5 is obsolete
}

message TrustedDataMessage {
  repeated DaaBlockV4 daaWindow = 1; // TODO: rename to `trustedSubDag` once v5 is obsolete
  repeated BlockGhostdagDataHashPair ghostdagData = 2; // TODO: remove once v5 is obsolete
}

// H6 sealed service state: a fresh node downloads every finality-flushed service-bond row
// (escrow burns and strike-log records) up to its new pruning point and verifies the set's
// MuHash against `serviceStateHash` of an already-validated header referencing that pruning
// point. Rows are the canonical commitment byte forms (see consensus `service_commit`).
message RequestServiceStateMessage {
  Hash pruningPointHash = 1;
}

message ServiceStateChunkMessage {
  repeated bytes rows = 1;
}

message DoneServiceStateChunksMessage {
}

// Canonical service-ledger snapshot at the requested pruning point (protocol v12+), chunked.
message ServiceLedgerSnapshotChunkMessage {
  bytes chunk = 1;
}

message DoneServiceLedgerSnapshotChunksMessage {
}
